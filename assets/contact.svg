 fill="#F4F5F2" opacity=".4"/><circle cx="930" cy="280" r="4.5" fill="#F4F5F2"/><circle class="pulse" cx="690" cy="270" r="8" fill="#F4F5F2" opacity=".4"/><circle cx="690" cy="270" r="4.5" fill="#F4F5F2"/><circle cx="840" cy="165" r="36" fill="#4E6076" stroke="#F4F5F2" stroke-opacity=".7"/><g transform="translate(820,145) scale(0.1667)" fill="none" stroke="#F4F5F2" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M66 64V176M66 122L112 64M82 111L116 176" /><path d="M182 84C170 64 134 66 132 92C130 116 182 120 180 152C178 182 140 184 124 160" /></g><text x="44" y="112" font-size="40" font-weight="800" fill="#F4F5F2">Great software deserves</text><text x="44" y="160" font-size="40" font-weight="800" fill="#F4F5F2">thoughtful engineering.</text><text x="46" y="212" font-size="22" font-weight="500" font-style="italic" fill="#F4F5F2">Let’s build something meaningful.</text><text x="46" y="272" font-size="14.5" font-weight="600" fill="#F4F5F2">khushalsehrawat2003@gmail.com  ·  New Delhi, India</text></g></svg>
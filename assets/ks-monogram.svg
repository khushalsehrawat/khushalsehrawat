<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d"><title id="t">KS monogram</title><desc id="d">Monogram of the initials K and S in fine line strokes</desc><style>text{font-family:'Manrope','Plus Jakarta Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes flow{to{stroke-dashoffset:-96}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.85;transform:scale(1.5)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}
.flow{stroke-dasharray:5 9;animation:flow 7s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
.drift{animation:drift 16s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite}
.tw{animation:twinkle 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E6076"/><stop offset=".5" stop-color="#748BA3"/><stop offset=".8" stop-color="#8FAEA3"/><stop offset="1" stop-color="#A49BBE"/></linearGradient></defs><rect width="240" height="240" rx="58" fill="url(#m)"/><rect x="10" y="10" width="220" height="220" rx="50" fill="none" stroke="#E5E7E5" stroke-opacity=".35"/><g fill="none" stroke="#F4F5F2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M66 64V176M66 122L112 64M82 111L116 176" /><path d="M182 84C170 64 134 66 132 92C130 116 182 120 180 152C178 182 140 184 124 160" /></g><circle cx="112" cy="64" r="6" fill="#F4F5F2"/><circle cx="124" cy="160" r="6" fill="#F4F5F2"/></svg>
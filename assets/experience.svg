circle class="pulse" cx="250" cy="170" r="11" fill="#8FAEA3"/><circle cx="250" cy="170" r="7" fill="#F4F5F2" stroke="#4E6076" stroke-width="2.5"/><text x="286" y="176" font-size="25" font-weight="800" fill="#F4F5F2">Software Developer</text><text x="286" y="200" font-size="16" font-weight="700" fill="#CFE0D9">INOX Decor</text><rect x="390" y="185" width="75" height="22" rx="11" fill="#F4F5F2" fill-opacity=".18" stroke="#F4F5F2" stroke-opacity=".5"/><text x="428" y="200.5" font-size="11.5" font-weight="700" fill="#F4F5F2" text-anchor="middle">Current</text><text x="286" y="228" font-size="14.5" font-weight="500" fill="#F4F5F2">Developing a React Native / Expo mobile app, Node.js / Express APIs and a Next.js</text><text x="286" y="249" font-size="14.5" font-weight="500" fill="#F4F5F2">website on MySQL / MariaDB.</text><text x="286" y="275" font-size="14.5" font-weight="500" fill="#F4F5F2">Owning delivery too: Docker environments on Linux, GitHub Actions builds, tests</text><text x="286" y="296" font-size="14.5" font-weight="500" fill="#F4F5F2">and image publishing, plus DNS, SSL and deployment troubleshooting.</text><rect x="286" y="310" width="107" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="339" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">React Native</text><rect x="400.8" y="310" width="52" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="427" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Expo</text><rect x="460.40000000000003" y="310" width="72" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="497" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Node.js</text><rect x="540.7" y="310" width="72" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="577" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Next.js</text><rect x="621.0" y="310" width="128" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="685" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">MySQL / MariaDB</text><rect x="756.5" y="310" width="65" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="789" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Docker</text><rect x="829.9" y="310" width="121" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="890" y="326.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">GitHub Actions</text><text x="40" y="390" font-size="15" font-weight="700" fill="#F4F5F2">Jul 2025 – Aug 2026</text><circle cx="250" cy="385" r="7" fill="#F4F5F2" stroke="#4E6076" stroke-width="2.5"/><text x="286" y="391" font-size="25" font-weight="800" fill="#F4F5F2">Freelance Software / Web Developer</text><text x="286" y="415" font-size="16" font-weight="700" fill="#CFE0D9">TheBenzzCreations</text><rect x="453" y="400" width="68" height="22" rx="11" fill="#F4F5F2" fill-opacity=".18" stroke="#F4F5F2" stroke-opacity=".5"/><text x="487" y="415.5" font-size="11.5" font-weight="700" fill="#F4F5F2" text-anchor="middle">Studio</text><text x="286" y="443" font-size="14.5" font-weight="500" fill="#F4F5F2">Built and deployed client websites and backend APIs with Java / Spring Boot,</text><text x="286" y="464" font-size="14.5" font-weight="500" fill="#F4F5F2">Node.js and relational databases.</text><text x="286" y="490" font-size="14.5" font-weight="500" fill="#F4F5F2">Ran the hosting stack: Linux, Docker, Nginx, DNS and SSL/HTTPS, with CI/CD</text><text x="286" y="511" font-size="14.5" font-weight="500" fill="#F4F5F2">workflows and production issue resolution.</text><rect x="286" y="525" width="100" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="336" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Spring Boot</text><rect x="393.9" y="525" width="72" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="430" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Node.js</text><rect x="474.2" y="525" width="128" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="538" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">React / Next.js</text><rect x="609.7" y="525" width="65" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="642" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Docker</text><rect x="683.1" y="525" width="58" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="712" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Nginx</text><rect x="749.6" y="525" width="86" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="793" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">DNS / SSL</text><rect x="843.7" y="525" width="58" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="873" y="541.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">CI/CD</text><text x="40" y="605" font-size="15" font-weight="700" fill="#F4F5F2">May 2024 – Jun 2025</text><circle cx="250" cy="600" r="7" fill="#F4F5F2" stroke="#4E6076" stroke-width="2.5"/><text x="286" y="606" font-size="25" font-weight="800" fill="#F4F5F2">Software Developer</text><text x="286" y="630" font-size="16" font-weight="700" fill="#CFE0D9">Hurlad By The Eaglets</text><text x="286" y="658" font-size="14.5" font-weight="500" fill="#F4F5F2">Developed Java / Spring Boot REST APIs and full-stack functionality for client</text><text x="286" y="679" font-size="14.5" font-weight="500" fill="#F4F5F2">applications.</text><text x="286" y="705" font-size="14.5" font-weight="500" fill="#F4F5F2">Worked across relational databases, Git / GitHub, testing, debugging and issue</text><text x="286" y="726" font-size="14.5" font-weight="500" fill="#F4F5F2">resolution.</text><rect x="286" y="740" width="52" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="312" y="756.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Java</text><rect x="345.6" y="740" width="100" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="396" y="756.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Spring Boot</text><rect x="453.5" y="740" width="86" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="497" y="756.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">REST APIs</text><rect x="547.6" y="740" width="114" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="604" y="756.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">SQL databases</text><rect x="669.3000000000001" y="740" width="45" height="24" rx="12" fill="#F4F5F2" fill-opacity=".13" stroke="#F4F5F2" stroke-opacity=".38"/><text x="692" y="756.5" font-size="12" font-weight="600" fill="#F4F5F2" text-anchor="middle">Git</text></g></svg>
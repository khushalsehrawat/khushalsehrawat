<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-labelledby="t d"><title id="t">Selected work</title><desc id="d">Header for the projects section</desc><style>text{font-family:'Manrope','Plus Jakarta Sans','Inter','Segoe UI',Helvetica,Arial,sans-serif}
@keyframes flow{to{stroke-dashoffset:-96}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.85;transform:scale(1.5)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}
.flow{stroke-dasharray:5 9;animation:flow 7s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
.drift{animation:drift 16s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 120s linear infinite}
.tw{animation:twinkle 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0.55"><stop offset="0" stop-color="#52657B"/><stop offset="0.55" stop-color="#6F869D"/><stop offset="1" stop-color="#8A8DB0"/></linearGradient><filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><clipPath id="cp"><rect width="1000" height="190" rx="22"/></clipPath></defs><g clip-path="url(#cp)"><rect width="1000" height="190" fill="url(#g)"/><g class="drift" filter="url(#bl)"><circle cx="880" cy="40" r="160" fill="#8FAEA3" opacity="0.5"/><circle cx="60" cy="180" r="140" fill="#A49BBE" opacity="0.35"/></g><g stroke="#E5E7E5" stroke-opacity=".07" stroke-width="1"><path d="M0 0V190"/><path d="M50 0V190"/><path d="M100 0V190"/><path d="M150 0V190"/><path d="M200 0V190"/><path d="M250 0V190"/><path d="M300 0V190"/><path d="M350 0V190"/><path d="M400 0V190"/><path d="M450 0V190"/><path d="M500 0V190"/><path d="M550 0V190"/><path d="M600 0V190"/><path d="M650 0V190"/><path d="M700 0V190"/><path d="M750 0V190"/><path d="M800 0V190"/><path d="M850 0V190"/><path d="M900 0V190"/><path d="M950 0V190"/><path d="M1000 0V190"/><path d="M0 0H1000"/><path d="M0 50H1000"/><path d="M0 100H1000"/><path d="M0 150H1000"/></g><text x="40" y="76" font-size="34" font-weight="800" fill="#F4F5F2">Selected work</text><text x="40" y="108" font-size="15.5" font-weight="500" fill="#F4F5F2">Public repositories and hands-on labs. Click any panel to open the source.</text><text x="40" y="136" font-size="13.5" font-weight="600" fill="#F4F5F2" fill-opacity=".92">Employer and client source code is private, so it is described in Experience rather than linked here.</text><g fill="none" stroke="#F4F5F2" stroke-opacity=".4"><circle cx="900" cy="95" r="30"/><circle cx="900" cy="95" r="60"/><circle cx="900" cy="95" r="90"/></g><path class="flow" d="M780 150Q840 60 900 95T1000 40" stroke="#F4F5F2" fill="none" stroke-width="1.6"/><circle cx="900" cy="95" r="6" fill="#F4F5F2"/></g></svg>